<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Preparing Adventure... ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-dark: #121016;
    --text-light: #FFFDF8;
    --accent: #FFD54F;
  }
  
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-dark);
    font-family: 'Fredoka', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: var(--text-light);
  }

  .loader-container {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    opacity: 0;
    animation: fadeIn 1s forwards ease-out;
  }

  .sleeping-panda {
    font-size: 5rem;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255, 213, 79, 0.2));
  }

  .loading-text {
    font-size: 1.8rem;
    font-weight: 500;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #FFF, #FFD54F, #FFF);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
  }

  .progress-bar-wrap {
    width: 280px;
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #FFD54F, #FF9E00);
    border-radius: 10px;
    transition: width 0.1s ease;
    box-shadow: 0 0 10px rgba(255, 213, 79, 0.5);
  }

  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-15px) rotate(3deg); }
  }
  @keyframes shine {
    to { background-position: 200% center; }
  }

  .fade-out {
    opacity: 0 !important;
    transition: opacity 0.8s ease-in-out;
  }
</style>
</head>
<body>

<div class="loader-container" id="loader">
  <div class="sleeping-panda">🐼💤</div>
  <div class="loading-text">Preparing your adventure...</div>
  <div class="progress-bar-wrap">
    <div class="progress-fill" id="progress"></div>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const progress = document.getElementById("progress");
    const loader = document.getElementById("loader");
    
    let w = 0;
    const interval = setInterval(() => {
      w += Math.random() * 5 + 2; // smooth but random loading
      if (w >= 100) {
        w = 100;
        clearInterval(interval);
        progress.style.width = "100%";
        
        setTimeout(() => {
          loader.classList.add("fade-out");
          setTimeout(() => {
            window.location.href = "panda.html";
          }, 800);
        }, 500);
      } else {
        progress.style.width = w + "%";
      }
    }, 100);
  });
</script>

</body>
</html>
