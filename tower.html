<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>The Magical Tower ✨</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-dark: #121016;
  }

  body, html {
    margin: 0;
    padding: 0;
    font-family: 'Fredoka', sans-serif;
    background-color: var(--bg-dark);
    /* Initially hide scrollbar while fading in */
    overflow-x: hidden;
    scroll-behavior: smooth;
  }

  /* Magical Sky Background (Fixed) */
  .magical-sky {
    position: fixed;
    inset: 0;
    background: linear-gradient(to bottom, #0F0A1E 0%, #301934 30%, #FF9E5E 70%, #FFF8F0 100%);
    z-index: 1;
    pointer-events: none;
  }

  .stars {
    position: absolute;
    inset: 0;
    background-image: 
      radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
      radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0));
    background-repeat: repeat;
    background-size: 200px 200px;
    opacity: 0.8;
    animation: twinkle 4s infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  /* The Scroll Container (Determined by Tower Image Height) */
  .tower-world {
    position: relative;
    width: 100%;
    z-index: 2;
    display: flex;
    justify-content: center;
  }

  /* The Tower Image */
  .tower-img {
    width: 100%;
    max-width: 1200px;
    height: auto;
    object-fit: contain;
    object-position: bottom;
    display: block;
    pointer-events: none;
  }

  /* Ground Elements (At the bottom) */
  .ground-elements {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 400px;
    background: url('assets/images/river.png') center/cover no-repeat, linear-gradient(to top, #0f3d0f 20%, transparent);
    z-index: 3;
  }

  /* Messages Container (Fixed relative to viewport during lock) */
  .message-layer {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .glass-card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 24px;
    padding: 2.5rem 3.5rem;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3), inset 0 0 20px rgba(255,255,255,0.2);
    color: #FFFDF8;
    text-align: center;
    max-width: 600px;
    width: 90%;
    
    /* Animation initial state */
    opacity: 0;
    transform: translateY(40px) scale(0.95);
    transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: auto; /* Allow clicking button */
    
    display: none;
  }

  .glass-card.visible {
    display: block;
    opacity: 1;
    transform: translateY(0) scale(1);
    animation: float 4s ease-in-out infinite alternate;
  }

  .glass-card h3 {
    font-size: 2.2rem;
    margin: 0 0 1.5rem 0;
    text-shadow: 0 2px 5px rgba(0,0,0,0.5);
    font-family: 'Quicksand', sans-serif;
  }

  /* Premium Buttons */
  .glow-button {
    padding: 1rem 2.5rem;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.2rem;
    font-weight: 600;
    color: #4A2F00;
    background: linear-gradient(135deg, #FFE885 0%, #FFD54F 50%, #FFB7C5 100%);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255, 213, 79, 0.4), inset 0 -3px 8px rgba(0,0,0,0.1);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .glow-button:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 30px rgba(255, 213, 79, 0.6), inset 0 -3px 8px rgba(0,0,0,0.1);
  }

  @keyframes float {
    from { transform: translateY(0px) scale(1); }
    to { transform: translateY(-15px) scale(1); }
  }

  /* Top Balcony Girl (Positioned near the top) */
  .top-balcony-girl {
    position: absolute;
    top: 500px; /* Adjust based on tower.png height */
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 400px;
    z-index: 5;
    opacity: 0;
    transition: opacity 2s ease;
  }

  .top-balcony-girl.revealed {
    opacity: 1;
  }

  /* SVG Fallback Girl */
  .css-girl {
    width: 140px;
    position: absolute;
    bottom: -10px;
    left: 80px;
    filter: drop-shadow(0 0 10px rgba(255, 213, 79, 0.5));
  }

  .css-hair {
    position: absolute;
    top: 50px;
    left: 100px;
    width: 60px;
    height: 3000px; /* Flowing down */
    transform-origin: top center;
    animation: hairSway 5s ease-in-out infinite alternate;
  }

  @keyframes hairSway {
    from { transform: rotate(-2deg); }
    to { transform: rotate(2deg); }
  }

  /* Scroll Lock Overlay (invisible) */
  .scroll-lock-shield {
    position: fixed;
    inset: 0;
    z-index: 90;
    /* When active, blocks wheel/touch on body but allows it inside */
  }

  /* Fade Overlay */
  #fade-black-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 99999;
    opacity: 1;
    pointer-events: none;
    transition: opacity 1.5s ease-in-out;
  }
</style>
</head>
<body>

<!-- Fade from Black (Coming from Panda) -->
<div id="fade-black-overlay"></div>

<!-- Magical Sky -->
<div class="magical-sky">
  <div class="stars"></div>
</div>

<!-- Tower World (Scrollable content) -->
<div class="tower-world" id="towerWorld">
  <div style="position:relative; width:100%; max-width:1200px; display:flex; justify-content:center;">
    <img src="assets/images/tower.png" class="tower-img" id="mainTowerImage" alt="Tall Magical Tower">
  </div>
  <div class="ground-elements"></div>
</div>

<!-- Locked Messages Layer -->
<div class="message-layer" id="messageLayer">
  <!-- Card will be injected here by JS -->
</div>

<!-- Scroll Shield -->
<div class="scroll-lock-shield" id="scrollShield" style="display:none;"></div>

<script src="js/config.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    // 1. Fade in
    setTimeout(() => {
      document.getElementById("fade-black-overlay").style.opacity = "0";
    }, 100);

    // 2. Setup Scroll Positions & Messages
    window.addEventListener("load", () => {
      const totalHeight = document.body.scrollHeight;
      
      // Start at bottom
      window.scrollTo(0, totalHeight);

    const messages = CONFIG.towerMessages || [
      "Some friendships begin quietly.",
      "Some become unforgettable.",
      "Thank you for every smile.",
      "Thank you for always being there.",
      "Life is brighter because of you."
    ];

    // Scroll checkpoints (bottom to top)
    const step = (totalHeight - window.innerHeight) / 6;
    const stops = [
      totalHeight - step * 1,
      totalHeight - step * 2,
      totalHeight - step * 3,
      totalHeight - step * 4,
      totalHeight - step * 5
    ];

    let currentStopIndex = 0;
    let isLocked = false;
    let oldScrollY = window.scrollY;

    const messageLayer = document.getElementById("messageLayer");
    const scrollShield = document.getElementById("scrollShield");

    function lockScroll(msgIndex) {
      isLocked = true;
      document.body.style.overflow = "hidden";
      scrollShield.style.display = "block";

      messageLayer.innerHTML = `
        <div class="glass-card visible">
          <h3>${messages[msgIndex]}</h3>
          <button class="glow-button" id="continueBtn">Continue Climbing 🏰</button>
        </div>
      `;

      document.getElementById("continueBtn").addEventListener("click", () => {
        unlockScroll();
        currentStopIndex++;
        
        if (currentStopIndex >= 5) {
          // Reached the top!
          revealSummit();
        } else {
          // Auto-scroll slightly to show progression
          window.scrollTo({
            top: stops[currentStopIndex] + 200, // Scroll up a bit towards the next stop
            behavior: "smooth"
          });
        }
      });
    }

    function unlockScroll() {
      isLocked = false;
      document.body.style.overflow = "";
      scrollShield.style.display = "none";
      messageLayer.innerHTML = "";
    }

    function revealSummit() {
      // Prevent over-scrolling past the top
      window.scrollTo({ top: 0, behavior: "smooth" });

      setTimeout(() => {
        messageLayer.innerHTML = `
          <div class="glass-card visible">
            <h3>You've reached the top.</h3>
            <button class="glow-button" id="finalBtn">Read Final Letter 💌</button>
          </div>
        `;
        document.getElementById("finalBtn").addEventListener("click", () => {
          const overlay = document.getElementById("fade-black-overlay");
          overlay.style.pointerEvents = "all";
          overlay.style.opacity = "1";
          setTimeout(() => {
            window.location.href = "letter.html";
          }, 1500);
        });
      }, 2000);
    }

    // Scroll Event
    window.addEventListener("scroll", () => {
      if (isLocked) {
        // Enforce lock (in case of keyboard scroll etc)
        window.scrollTo(0, oldScrollY);
        return;
      }
      
      const currentY = window.scrollY;
      oldScrollY = currentY;

      // Check if we passed the next upward threshold
      if (currentStopIndex < 5 && currentY <= stops[currentStopIndex]) {
        lockScroll(currentStopIndex);
      }
    });
    }); // End window load event

  });
</script>
</body>
</html>
