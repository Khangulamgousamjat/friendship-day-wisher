<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customization Editor - Friendship Day Adventure 🛠️</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body {
      background: linear-gradient(135deg, #1E1B4B 0%, #0F0A1E 100%);
      color: #FFF8F0;
      min-height: 100vh;
      padding: 2.5rem 1rem;
      font-family: 'Nunito', sans-serif;
    }

    .editor-card-container {
      max-width: 840px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 32px;
      padding: 3rem 2.8rem;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4);
    }

    .editor-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .editor-title {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 2.4rem;
      color: #FFD54F;
      margin: 0;
    }

    .back-home-link {
      color: #FFB7C5;
      text-decoration: none;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      padding: 0.5rem 1.2rem;
      border: 1px solid rgba(255, 183, 197, 0.5);
      border-radius: 20px;
      transition: all 0.3s ease;
    }

    .back-home-link:hover {
      background: rgba(255, 183, 197, 0.2);
    }

    .section-heading {
      color: #FFD54F;
      margin: 2.2rem 0 1rem;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.5rem;
      border-bottom: 1px solid rgba(255, 213, 79, 0.3);
      padding-bottom: 0.4rem;
    }

    .form-group {
      margin-bottom: 1.6rem;
    }

    .form-group label {
      display: block;
      font-family: 'Quicksand', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: #FFD86B;
      margin-bottom: 0.5rem;
    }

    .form-control {
      width: 100%;
      padding: 0.95rem 1.2rem;
      border-radius: 14px;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.35);
      color: #FFFFFF;
      font-family: 'Nunito', sans-serif;
      font-size: 1.05rem;
    }

    .form-control:focus {
      outline: none;
      border-color: #FFD54F;
      box-shadow: 0 0 16px rgba(255, 213, 79, 0.4);
    }

    textarea.form-control {
      min-height: 100px;
      resize: vertical;
    }

    .editor-actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1.0rem;
      justify-content: center;
      margin-top: 2.8rem;
    }

    .btn-secondary {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      padding: 0.85rem 1.6rem;
      border-radius: 50px;
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.28);
      transform: translateY(-2px);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-bar {
      padding: 1rem 2rem;
      background: #141316;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .editor-toast-msg {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      padding: 1.1rem 2.0rem;
      border-radius: 20px;
      background: #1E1B4B;
      color: #FFD54F;
      font-weight: 700;
      box-shadow: 0 12px 35px rgba(0,0,0,0.5);
      border: 1.5px solid #FFD54F;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.4s ease;
      z-index: 99999;
    }

    .editor-toast-msg.visible {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="editor-card-container">
    <div class="editor-header-bar">
      <h1 class="editor-title">Customization Editor 🛠️</h1>
      <a href="index.html" class="back-home-link">View Story 🐼 →</a>
    </div>

    <form id="editor-form">

      <!-- 1. General & Panda Intro -->
      <h3 class="section-heading">1. General & Panda Welcome</h3>
      
      <div class="form-group">
        <label for="friendName">Friend's Name</label>
        <input type="text" id="friendName" class="form-control">
      </div>

      <div class="form-group">
        <label for="pandaWelcome">Panda Welcome Text</label>
        <input type="text" id="pandaWelcome" class="form-control">
      </div>

      <div class="form-group">
        <label for="pandaStory">Panda Story Text</label>
        <textarea id="pandaStory" class="form-control"></textarea>
      </div>

      <div class="form-group">
        <label for="buttonText">Panda CTA Button Text</label>
        <input type="text" id="buttonText" class="form-control">
      </div>

      <div class="form-group">
        <label for="continueButtonText">Tower Continue Button Text</label>
        <input type="text" id="continueButtonText" class="form-control">
      </div>

      <!-- 2. Tower & Image Assets -->
      <h3 class="section-heading">2. Tower & Image Assets</h3>

      <div class="form-group"><label for="towerImage">Tower Image Path</label><input type="text" id="towerImage" class="form-control"></div>
      <div class="form-group"><label for="girlImage">Girl Image Path</label><input type="text" id="girlImage" class="form-control"></div>
      <div class="form-group"><label for="hairImage">Hair Image Path</label><input type="text" id="hairImage" class="form-control"></div>
      <div class="form-group"><label for="backgroundImage">Background Image Path</label><input type="text" id="backgroundImage" class="form-control"></div>

      <!-- 3. Tower Messages -->
      <h3 class="section-heading">3. Tower Climb Messages (5 Cards)</h3>

      <div class="form-group"><label for="towerMessage1">Tower Message 1 (15%)</label><input type="text" id="towerMessage1" class="form-control"></div>
      <div class="form-group"><label for="towerMessage2">Tower Message 2 (30%)</label><input type="text" id="towerMessage2" class="form-control"></div>
      <div class="form-group"><label for="towerMessage3">Tower Message 3 (45%)</label><input type="text" id="towerMessage3" class="form-control"></div>
      <div class="form-group"><label for="towerMessage4">Tower Message 4 (60%)</label><input type="text" id="towerMessage4" class="form-control"></div>
      <div class="form-group"><label for="towerMessage5">Tower Message 5 (80%)</label><input type="text" id="towerMessage5" class="form-control"></div>

      <!-- 4. Final Title & Letter -->
      <h3 class="section-heading">4. Final Letter & Theme Settings</h3>

      <div class="form-group"><label for="finalTitle">Final Title</label><input type="text" id="finalTitle" class="form-control"></div>
      <div class="form-group"><label for="finalMessage">Final Message</label><textarea id="finalMessage" class="form-control"></textarea></div>

      <div class="form-group">
        <label for="themeSelect">Theme Palette</label>
        <select id="themeSelect" class="form-control">
          <option value="golden">Golden Hour (Default)</option>
          <option value="pink">Blossom Pink</option>
          <option value="lavender">Twilight Lavender</option>
          <option value="sunset">Sunset Orange</option>
        </select>
      </div>

      <div class="form-group">
        <label for="lanternCount">Lantern Count</label>
        <input type="number" id="lanternCount" class="form-control" min="20" max="200">
      </div>

      <div class="form-group" style="display:flex; align-items:center; gap:1rem;">
        <input type="checkbox" id="music" style="width:22px; height:22px;">
        <label for="music" style="margin:0;">Enable Fairytale Music</label>
      </div>

      <!-- Buttons -->
      <div class="editor-actions-row">
        <button id="save-btn" type="button" class="btn-primary">Save 💾</button>
        <button id="preview-btn" type="button" class="btn-secondary">Preview 👁️</button>
        <button id="export-btn" type="button" class="btn-secondary">Export JSON 📥</button>
        <button id="import-btn" type="button" class="btn-secondary">Import JSON 📤</button>
        <input type="file" id="import-file-input" accept=".json" style="display:none;">
        <button id="reset-btn" type="button" class="btn-secondary" style="color:#FFB7C5;">Reset Defaults 🔄</button>
      </div>

    </form>
  </div>

  <!-- Live Modal Preview -->
  <div id="preview-modal" class="modal-overlay">
    <div class="modal-bar">
      <span style="font-weight:700; color:#FFD54F;">Live Interactive Preview</span>
      <button id="modal-close-btn" class="btn-secondary" style="padding:0.4rem 1.2rem;">Close ✖</button>
    </div>
    <iframe id="preview-iframe" class="modal-iframe" src="about:blank"></iframe>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
