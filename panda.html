<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Panda World ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-dark: #121016;
  }
  
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-dark);
    font-family: 'Fredoka', sans-serif;
    overflow: hidden;
  }

  /* Realistic Jungle Background */
  .jungle-bg {
    position: absolute;
    inset: 0;
    background: url('assets/images/jungle-background.png') center/cover no-repeat;
    z-index: 1;
    /* Adding a slight zoom animation for life */
    animation: gentleBreath 20s ease-in-out infinite alternate;
  }

  @keyframes gentleBreath {
    from { transform: scale(1.0); }
    to { transform: scale(1.05); }
  }

  /* Overlay to make text readable */
  .dark-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.5) 100%);
    z-index: 2;
  }

  /* Panda Area */
  .panda-area {
    position: relative;
    z-index: 10;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding-bottom: 5vh;
  }

  #panda-svg-wrapper {
    position: relative;
    width: 240px;
    height: 288px;
    margin-bottom: 1rem;
    filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5));
  }

  /* Speech Bubble */
  .speech {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 24px;
    padding: 1.5rem 2.5rem;
    text-align: center;
    max-width: 600px;
    width: 90%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3), inset 0 0 20px rgba(255,255,255,0.1);
    color: #FFFDF8;
    position: relative;
  }

  .speech::after {
    content: '';
    position: absolute;
    bottom: -15px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 15px 15px 0;
    border-style: solid;
    border-color: rgba(255, 255, 255, 0.15) transparent transparent transparent;
  }

  .speech h1 {
    font-size: 2.2rem;
    margin: 0 0 0.5rem 0;
    font-weight: 600;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    background: linear-gradient(135deg, #FFD54F, #FF9E00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .speech p {
    font-size: 1.2rem;
    margin: 0;
    font-family: 'Nunito', sans-serif;
    line-height: 1.5;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }

  .cursor-caret {
    display: inline-block;
    width: 2px;
    height: 1.1em;
    background: #FFD54F;
    animation: blink 0.8s step-end infinite;
    vertical-align: text-bottom;
    margin-left: 4px;
  }

  @keyframes blink { 50% { opacity: 0; } }

  /* Premium Continue Button */
  .glow-button {
    margin-top: 1.5rem;
    padding: 1rem 2.5rem;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.2rem;
    font-weight: 600;
    color: #4A2F00;
    background: linear-gradient(135deg, #FFE885 0%, #FFD54F 50%, #FFB7C5 100%);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255, 213, 79, 0.4), inset 0 -3px 8px rgba(0,0,0,0.1);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
  }

  .glow-button.visible {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .glow-button:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 30px rgba(255, 213, 79, 0.6), inset 0 -3px 8px rgba(0,0,0,0.1);
  }

  /* Fade To Black Overlay */
  #fade-black-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 99999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s ease-in-out;
  }

</style>
<!-- Include Panda CSS for SVG animations -->
<link rel="stylesheet" href="css/panda.css">
</head>
<body>

<div class="jungle-bg"></div>
<div class="dark-overlay"></div>

<div class="panda-area">
  <!-- Original SVG Panda -->
  <div id="panda-svg-wrapper">
    <svg id="panda-svg" viewBox="0 0 300 360" width="240" height="288" xmlns="http://www.w3.org/2000/svg">
      <ellipse id="shadow" cx="150" cy="340" rx="85" ry="16" fill="rgba(71,58,58,0.15)" />
      <g id="tail" transform-origin="90 280"><ellipse cx="80" cy="275" rx="18" ry="14" fill="#2D292E" transform="rotate(-15 80 275)"/></g>
      <g id="leftLeg" transform-origin="95 305"><ellipse cx="95" cy="305" rx="32" ry="24" fill="#2D292E" /><ellipse cx="90" cy="310" rx="14" ry="10" fill="#3D3840" /></g>
      <g id="rightLeg" transform-origin="205 305"><ellipse cx="205" cy="305" rx="32" ry="24" fill="#2D292E" /><ellipse cx="210" cy="310" rx="14" ry="10" fill="#3D3840" /></g>
      <g id="body" transform-origin="150 240"><ellipse cx="150" cy="240" rx="90" ry="78" fill="#FFFDF8" /><ellipse cx="150" cy="245" rx="72" ry="60" fill="#FFFFFF" /><path d="M 75 190 Q 150 220 225 190 Q 238 245 212 265 Q 150 280 88 265 Q 62 240 75 190 Z" fill="#2D292E"/></g>
      <g id="leftArm" transform-origin="75 195"><path d="M 75 195 Q 40 220 48 255 Q 70 270 90 230 Z" fill="#2D292E"/><circle cx="55" cy="248" r="7" fill="#FFB7C5" opacity="0.8"/></g>
      <g id="rightArm" transform-origin="225 195"><path d="M 225 195 Q 260 220 252 255 Q 230 270 210 230 Z" fill="#2D292E"/><circle cx="245" cy="248" r="7" fill="#FFB7C5" opacity="0.8"/></g>
      <g id="head" transform-origin="150 145">
        <g id="leftEar" transform-origin="78 70"><ellipse cx="78" cy="70" rx="32" ry="30" fill="#2D292E" transform="rotate(-20 78 70)"/><ellipse cx="80" cy="73" rx="18" ry="16" fill="#423C45" transform="rotate(-20 78 70)"/></g>
        <g id="rightEar" transform-origin="222 70"><ellipse cx="222" cy="70" rx="32" ry="30" fill="#2D292E" transform="rotate(20 222 70)"/><ellipse cx="220" cy="73" rx="18" ry="16" fill="#423C45" transform="rotate(20 222 70)"/></g>
        <ellipse cx="150" cy="145" rx="92" ry="76" fill="#FFFDF8" />
        <g id="cheeks"><ellipse id="leftCheek" cx="86" cy="165" rx="20" ry="12" fill="#FF9BBB" opacity="0.65"/><ellipse id="rightCheek" cx="214" cy="165" rx="20" ry="12" fill="#FF9BBB" opacity="0.65"/></g>
        <g id="eyePatches"><ellipse cx="102" cy="138" rx="28" ry="34" fill="#2D292E" transform="rotate(-14 102 138)"/><ellipse cx="198" cy="138" rx="28" ry="34" fill="#2D292E" transform="rotate(14 198 138)"/></g>
        <g id="leftEye"><ellipse cx="105" cy="138" rx="14" ry="18" fill="#FFFFFF"/></g>
        <g id="rightEye"><ellipse cx="195" cy="138" rx="14" ry="18" fill="#FFFFFF"/></g>
        <g id="pupils"><g id="leftPupil"><circle cx="105" cy="138" r="9" fill="#1C1A1D"/><circle cx="101" cy="134" r="3.5" fill="#FFFFFF"/></g><g id="rightPupil"><circle cx="195" cy="138" r="9" fill="#1C1A1D"/><circle cx="191" cy="134" r="3.5" fill="#FFFFFF"/></g></g>
        <g id="eyelids"><rect id="leftEyelid" x="88" y="118" width="34" height="0" fill="#2D292E" rx="4"/><rect id="rightEyelid" x="178" y="118" width="34" height="0" fill="#2D292E" rx="4"/></g>
        <g id="nose"><ellipse cx="150" cy="158" rx="11" ry="7" fill="#232025"/></g>
        <g id="smileGroup"><path id="smile" d="M 138 168 Q 150 182 162 168" fill="none" stroke="#232025" stroke-width="4" stroke-linecap="round"/></g>
      </g>
    </svg>
  </div>

  <!-- Typewriter Speech Bubble -->
  <div class="speech">
    <h1 id="welcomeText"><span class="typewriter-text"></span><span class="cursor-caret" id="welcomeCaret">|</span></h1>
    <p id="storyText"><span class="typewriter-text"></span><span class="cursor-caret" id="storyCaret" style="display:none;">|</span></p>
    <button id="startAdventure" class="glow-button">Continue Adventure ✨</button>
  </div>
</div>

<div id="fade-black-overlay"></div>

<script src="js/config.js"></script>
<script src="js/panda.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    // Initialize Panda animations
    if (typeof PandaController !== "undefined") {
      window.pandaInstance = new PandaController();
      window.pandaInstance.animateEntrance();
    }

    // Run Typewriter
    const welcomeStr = CONFIG.pandaWelcome || "Happy Friendship Day!";
    const storyStr = CONFIG.pandaStory || "I found a magical adventure just for you.";
    
    runTypewriter("welcomeText", welcomeStr, 40, () => {
      document.getElementById("welcomeCaret").style.display = "none";
      document.getElementById("storyCaret").style.display = "inline-block";
      
      setTimeout(() => {
        runTypewriter("storyText", storyStr, 30, () => {
          document.getElementById("storyCaret").style.display = "none";
          document.getElementById("startAdventure").classList.add("visible");
        });
      }, 500);
    });
    
    // Transition
    document.getElementById("startAdventure").addEventListener("click", () => {
      const overlay = document.getElementById("fade-black-overlay");
      overlay.style.pointerEvents = "all";
      overlay.style.opacity = "1";
      
      setTimeout(() => {
        window.location.href = "tower.html";
      }, 1500); // Wait for fade out
    });
  });

  function runTypewriter(elementId, text, speed = 35, callback) {
    const container = document.getElementById(elementId);
    if (!container) return;
    const targetSpan = container.querySelector(".typewriter-text");
    if (!targetSpan) return;
    
    let index = 0;
    targetSpan.textContent = "";
    
    const timer = setInterval(() => {
      targetSpan.textContent += text.charAt(index);
      index++;
      if (index >= text.length) {
        clearInterval(timer);
        if (callback) callback();
      }
    }, speed);
  }
</script>

</body>
</html>
