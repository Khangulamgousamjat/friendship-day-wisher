<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 3500" width="600" height="3500" preserveAspectRatio="xMidYMin meet">
  <defs>
    <linearGradient id="towerWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DCD2C0"/>
      <stop offset="40%" stop-color="#E8E0D0"/>
      <stop offset="80%" stop-color="#CFC4B0"/>
      <stop offset="100%" stop-color="#B8AC98"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A2674B"/>
      <stop offset="100%" stop-color="#6E3D27"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3A7"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>
    <filter id="softGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#FFD54F" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Ground & Tower Base (0px to 500px from bottom, y = 3000 to 3500) -->
  <g id="tower-base">
    <ellipse cx="300" cy="3470" rx="280" ry="25" fill="#8FA982" opacity="0.85"/>
    <path d="M 120 3500 L 140 3100 L 460 3100 L 480 3500 Z" fill="url(#towerWall)"/>
    <!-- Base Wooden Door -->
    <path d="M 230 3500 L 230 3320 Q 300 3270 370 3320 L 370 3500 Z" fill="#543A29" stroke="#3D291C" stroke-width="6"/>
    <circle cx="348" cy="3410" r="7" fill="#FFD54F"/>
    <!-- Flower Beds at Base -->
    <text x="140" y="3480" font-size="32">🌸🌺🌼🌸🌺🌼</text>
    <text x="360" y="3480" font-size="32">🌺🌼🌸🌺🌼🌸</text>
  </g>

  <!-- Lower Tower Body (y = 2000 to 3100) -->
  <g id="tower-lower-body">
    <rect x="140" y="2000" width="320" height="1100" fill="url(#towerWall)"/>
    <!-- Stone Texture Lines -->
    <path d="M 140 2200 L 460 2200 M 140 2400 L 460 2400 M 140 2600 L 460 2600 M 140 2800 L 460 2800 M 140 3000 L 460 3000" stroke="rgba(0,0,0,0.08)" stroke-width="3" stroke-dasharray="15,10"/>
    <!-- Windows -->
    <rect x="235" y="2850" width="130" height="180" rx="65" fill="url(#windowGlow)" stroke="#543A29" stroke-width="6" filter="url(#softGlow)"/>
    <rect x="235" y="2450" width="130" height="180" rx="65" fill="url(#windowGlow)" stroke="#543A29" stroke-width="6" filter="url(#softGlow)"/>
    <rect x="235" y="2050" width="130" height="180" rx="65" fill="url(#windowGlow)" stroke="#543A29" stroke-width="6" filter="url(#softGlow)"/>
    <!-- Ivy Vines -->
    <path d="M 135 2000 Q 110 2400 135 2800 Q 150 3100 135 3400" stroke="#5D8A4E" stroke-width="12" fill="none" stroke-linecap="round"/>
    <text x="110" y="2200" font-size="28">🌿🌿🌿</text>
    <text x="110" y="2600" font-size="28">🌿🌿🌿</text>
    <text x="110" y="3000" font-size="28">🌿🌿🌿</text>
  </g>

  <!-- Mid Tower Body & Balcony (y = 800 to 2000) -->
  <g id="tower-mid-body">
    <rect x="150" y="800" width="300" height="1200" fill="url(#towerWall)"/>
    <rect x="235" y="1650" width="130" height="180" rx="65" fill="url(#windowGlow)" stroke="#543A29" stroke-width="6" filter="url(#softGlow)"/>
    <rect x="235" y="1250" width="130" height="180" rx="65" fill="url(#windowGlow)" stroke="#543A29" stroke-width="6" filter="url(#softGlow)"/>
    <rect x="235" y="850" width="130" height="180" rx="65" fill="url(#windowGlow)" stroke="#543A29" stroke-width="6" filter="url(#softGlow)"/>
    <!-- Right Side Ivy Vines -->
    <path d="M 465 800 Q 485 1400 465 2000 Q 450 2600 465 3200" stroke="#5D8A4E" stroke-width="12" fill="none" stroke-linecap="round"/>
    <text x="450" y="1000" font-size="28">🌿🌿🌿</text>
    <text x="450" y="1500" font-size="28">🌿🌿🌿</text>
    <text x="450" y="2000" font-size="28">🌿🌿🌿</text>
  </g>

  <!-- Top Tower Section & Balcony Window (y = 150 to 800) -->
  <g id="tower-top-section">
    <!-- Top Balcony Ledge -->
    <rect x="120" y="420" width="360" height="35" rx="8" fill="#A09380" stroke="#543A29" stroke-width="4"/>
    <path d="M 120 420 L 120 380 L 480 380 L 480 420 Z" fill="#B0A390"/>
    <!-- Balcony Railing -->
    <path d="M 130 380 L 470 380 M 150 420 L 150 380 M 200 420 L 200 380 M 250 420 L 250 380 M 300 420 L 300 380 M 350 420 L 350 380 M 400 420 L 400 380 M 450 420 L 450 380" stroke="#543A29" stroke-width="5"/>
    
    <!-- Top Glowing Arched Balcony Window -->
    <rect x="210" y="180" width="180" height="230" rx="90" fill="url(#windowGlow)" stroke="#543A29" stroke-width="8" filter="url(#softGlow)"/>

    <!-- Flower Boxes on Balcony -->
    <text x="140" y="415" font-size="26">🌸🌺🌼🌸🌺🌼🌸</text>

    <!-- Conical Roof & Spire -->
    <path d="M 140 180 L 300 20 L 460 180 Z" fill="url(#roofGrad)"/>
    <circle cx="300" cy="18" r="12" fill="#FFD54F" filter="url(#softGlow)"/>
    <text x="286" y="-5" font-size="30">⭐</text>
  </g>
</svg>
